name: release

# Pushing a tag v<version> builds the `legible` command for each platform
# and publishes the archives, their SHA-256 sums and build provenance as a
# GitHub release. The tag must match the workspace version in Cargo.toml.
# Then it stages @legiblerecords/legible on npm, whose version must match
# too. npm trusts this workflow as the package's trusted publisher, so there
# is no npm token, and every version gets provenance. A staged version isn't
# public until a maintainer approves it with 2FA, on npmjs.com under Staged
# Packages or with `npm stage approve`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds are static (musl), so they run on any distribution.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(awk -F'"' '/^\[workspace.package\]/ { p = 1 } p && /^version/ { print $2; exit }' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --locked -p legible --target ${{ matrix.target }}
      - name: Check it runs
        shell: bash
        run: target/${{ matrix.target }}/release/legible --version
      - name: Package
        id: package
        shell: bash
        run: |
          name="legible-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/legible.exe" "$name/"
            7z a -tzip "$name.zip" "$name" >/dev/null
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/legible" "$name/"
            tar -czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum legible-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "legible $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  npm:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 comes with npm 11; staged publishing needs npm 11.15.0 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Check the tag matches the package version
        working-directory: packages/legible
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the package version $version"
            exit 1
          fi
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      # binaryen pinned: Ubuntu 24.04's package (version 108) corrupts the
      # externref table wasm-bindgen emits, and the module then won't load.
      - name: Install binaryen (wasm-opt) version_123
        run: |
          curl -fsSLo /tmp/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  /tmp/binaryen.tar.gz" | sha256sum -c
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo /tmp/binaryen-version_123/bin >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
        working-directory: packages/legible
      - run: npm run build
        working-directory: packages/legible
      - run: npm test
        working-directory: packages/legible
      - run: npm stage publish --access public
        working-directory: packages/legible
