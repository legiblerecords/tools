name: npm

# Runs only when the package, the Rust code it's built from (and whose
# vectors it tests against), or this workflow change; not for documentation,
# the skill or other workflows. LICENSE is copied into the package.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/legible/**"
      - "LICENSE"
      - ".github/workflows/npm.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/legible/**"
      - "LICENSE"
      - ".github/workflows/npm.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      # binaryen pinned: Ubuntu 24.04's package (version 108) corrupts the
      # externref table wasm-bindgen emits, and the module then won't load.
      - name: Install binaryen (wasm-opt) version_123
        run: |
          curl -fsSLo /tmp/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  /tmp/binaryen.tar.gz" | sha256sum -c
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo /tmp/binaryen-version_123/bin >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
        working-directory: packages/legible
      - run: npm run build
        working-directory: packages/legible
      - run: npm test
        working-directory: packages/legible
      - name: Report sizes
        working-directory: packages/legible
        run: |
          {
            echo "## Package size"
            echo
            echo "| What | Bytes |"
            echo "|---|---|"
            f=dist/legible_records_wasm_bg.wasm
            echo "| .wasm | $(stat -c %s "$f") |"
            echo "| .wasm, gzipped | $(gzip -9 -c "$f" | wc -c) |"
            npm pack --dry-run --json > pack.json
            echo "| npm tarball | $(node -p 'require("./pack.json")[0].size') |"
            echo "| installed (unpacked) | $(node -p 'require("./pack.json")[0].unpackedSize') |"
            echo
            echo "Files: $(node -p 'require("./pack.json")[0].files.map(f => f.path).join(", ")')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
