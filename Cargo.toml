[workspace]
resolver = "2"
members = ["crates/legible-records", "crates/legible", "crates/legible-records-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/legiblerecords/tools"
rust-version = "1.89"

[workspace.dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
yaml-rust2 = "0.13"
jsonschema = { version = "=0.58.0", default-features = false }
clap = { version = "4", features = ["derive"] }
# Deflate only, in pure Rust (miniz_oxide), so the bundle code also builds for WebAssembly.
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
getrandom = "0.2"
zeroize = "1"
legible-records = { path = "crates/legible-records", version = "0.2.0", default-features = false }

# The WebAssembly build for npm: smallest code over fastest, since it is
# downloaded by browsers. The CLI keeps the normal release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Not strip: wasm-bindgen and wasm-opt need the target_features section to
# know which WebAssembly features are in use. build.sh strips after wasm-opt.
